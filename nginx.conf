# nginx reverse-proxy config for the dalfy stack — two independent server
# blocks, one per domain. Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/dalfy
#   sudo ln -s /etc/nginx/sites-available/dalfy /etc/nginx/sites-enabled/dalfy
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: the ssl_certificate paths below assume certbot (Let's Encrypt) issued
# per-domain certs via the standard webroot/nginx plugin, e.g.:
#   sudo certbot --nginx -d api.dalfy.net -d admin.dalfy.net
# Until certbot has run once, the 443 blocks will fail nginx -t (missing
# cert files) — bring the site up on 80 only first, or let certbot's --nginx
# plugin edit this file for you on first issuance instead of doing it by hand.

# ---- api.dalfy.net -> FastAPI/uvicorn on 127.0.0.1:8000 ----
server {
    listen 80;
    listen [::]:80;
    server_name api.dalfy.net;

    # Let's Encrypt HTTP-01 challenge path — must stay reachable over plain
    # HTTP even after HTTPS is set up, for cert renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.dalfy.net;

    ssl_certificate     /etc/letsencrypt/live/api.dalfy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dalfy.net/privkey.pem;

    # Document uploads (app/api/documents.py, multipart) — generous enough
    # for RAG source files without leaving the limit wide open.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Telegram/WhatsApp webhooks and the AI pipeline can legitimately
        # take a while (tool-calling round-trips) — default 60s is tight.
        proxy_read_timeout 120s;
    }
}

# ---- admin.dalfy.net -> static salon-admin build (no backend involved) ----
server {
    listen 80;
    listen [::]:80;
    server_name admin.dalfy.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.dalfy.net;

    ssl_certificate     /etc/letsencrypt/live/admin.dalfy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dalfy.net/privkey.pem;

    # Adjust to wherever salon-admin's files (index.html, css/, js/) are
    # actually deployed on this server — this is a placeholder path.
    root /var/www/dalfy-admin;
    index index.html;

    # Vanilla static SPA with no client-side router beyond hash-based
    # navigation (#/bookings etc.) — every real path serves index.html,
    # no rewrite rules needed for deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are plain files with no build-hash in their names (no
    # bundler — see js/screens/*.js served as-is), so keep caching short
    # rather than "cache forever" to avoid the exact staleness problem the
    # ?v=N query strings in index.html were already added to work around.
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }
}
